<title>PIPPI STUDIO</title>

<style>
/* VOICE simple, quiet studio profile
   IDEA a plain business card on a white desk
   PICTURE the studio logo itself
   COLOUR white ground, near-black ink, one grey rule
   TYPE Zen Kaku Gothic New
   LAYOUT one centred column: logo, short intro, two-row table */
:root{color-scheme:light dark;--bg:light-dark(#fff,#141414);--ink:light-dark(#151515,#f2f2f2);--sub:light-dark(#6b6b6b,#a5a5a5);--line:light-dark(#e3e3e3,#333)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.8 "Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;overflow-x:clip}
.wrap{max-width:640px;margin:0 auto;padding:clamp(48px,10vw,110px) max(6vw,20px) 56px}
h1{margin:0;line-height:0}
.logo{display:block;width:clamp(280px,80vw,520px);height:auto;max-width:100%;margin:0 auto;fill:var(--ink)}
.lead{margin:clamp(28px,5vw,44px) 0 32px;font-size:17px}
table{width:100%;border-collapse:collapse;border-top:1px solid var(--line)}
th,td{border-bottom:1px solid var(--line);padding:18px 0;text-align:left;vertical-align:top}
th{width:9em;padding-right:16px;font-weight:500;font-size:14px;color:var(--sub);white-space:nowrap}
td div+div{margin-top:4px}
.note{font-size:14px;color:var(--sub)}
a{color:var(--ink);font-weight:700;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;overflow-wrap:anywhere}
a:hover{text-decoration-thickness:2px}
a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
footer{margin-top:56px;font-size:13px;color:var(--sub)}
@media(max-width:600px){th{width:7.5em;font-size:13px}}
</style>
</head>
